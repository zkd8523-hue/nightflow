<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;word-break:keep-all}
html,body{background:#555}
.m{font-family:"IBM Plex Mono",monospace;font-weight:700}
.p{position:relative;overflow:hidden;background:#EFE5D0}
.p>img.bg{position:absolute;top:0;left:0;width:100%;object-fit:cover}

/* ── 인스타 4:5 — 띠 포함 ── */
#ig{width:1080px;height:1350px}
#ig>img.bg{height:1050px;object-position:center 8%}
#ig .band{position:absolute;left:0;right:0;bottom:0;height:300px;background:#EFE5D0;
  padding:36px 52px 0;display:flex;flex-direction:column}
#ig h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:74px;line-height:1.02;
  letter-spacing:-.03em;color:#E8431A}
#ig h1 em{font-style:normal;color:#17110B}
#ig .row{margin-top:auto;padding:18px 0 26px;border-top:4px solid #17110B;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
#ig .nm{font-family:"Archivo Black",sans-serif;font-size:34px;color:#17110B;line-height:1}
#ig .dt{font-size:18px;color:#17110B;text-align:right;line-height:1.65}

/* ── 홈 카드 16:9 ──
   세로 포스터를 16:9 로 자르면 셋 중 하나가 반드시 잘린다(실제로 주인공인
   Evian Christ 가 날아갔다). 자르지 말고 오른쪽에 통째로 얹고, 왼쪽은
   종이색으로 비운다 — 카드가 제목을 왼쪽 아래에 얹으므로 거기가 제목 자리다. */
#home{width:1080px;height:608px;background:#EFE5D0}
#home>img.bg{left:auto;right:0;width:auto;height:100%;object-fit:contain;object-position:right center}
#home .edge{position:absolute;top:0;bottom:0;right:0;width:620px;
  box-shadow:-26px 0 46px -18px rgba(23,17,11,.3)}
#home .mark{position:absolute;left:52px;top:46px;font-family:"Archivo Black",sans-serif;
  font-size:30px;line-height:1.08;color:#17110B;letter-spacing:.01em}
#home .kick{position:absolute;left:52px;top:132px;font-family:"Nanum Myeongjo",serif;font-weight:800;
  font-size:50px;line-height:1.12;letter-spacing:-.03em;color:#E8431A}

/* ── 아티클 본문 3:2 — 그림만 ── */
#art{width:1080px;height:720px}
#art>img.bg{height:100%;object-position:center 26%}
</style></head><body>

<div class="p" id="ig">
  <img class="bg" src="base.png">
  <div class="band">
    <h1>칸예 · 스캇 앨범<br><em>만든 DJ가 온다</em></h1>
    <div class="row">
      <div class="nm">EVIAN CHRIST</div>
      <div class="dt m">10.23 FRI · CAKESHOP ITAEWON<br>자정 전 25,000원 · 자정 후 30,000원</div>
    </div>
  </div>
</div>

<div class="p" id="home">
  <img class="bg" src="base.png"><span class="edge"></span>
</div>
  <div class="kick">칸예 · 스캇<br>앨범 만든 DJ</div>
</div>
<div class="p" id="art"><img class="bg" src="base.png"></div>

</body></html>
