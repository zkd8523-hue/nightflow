<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&family=Nanum+Myeongjo:wght@800&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;word-break:keep-all}
html,body{background:#555}
.p{position:relative;width:1080px;height:1350px;overflow:hidden}
.p>img.bg{position:absolute;top:0;left:0;width:100%;height:1050px;object-fit:cover;object-position:center 8%}
.m{font-family:"IBM Plex Mono",monospace;font-weight:700}
.band{position:absolute;left:0;right:0;bottom:0;height:300px;background:#EFE5D0;
  padding:36px 52px 0;display:flex;flex-direction:column}
.band h1{line-height:1.02;color:#E8431A}
.band h1 em{font-style:normal;color:#17110B}
.row{margin-top:auto;padding:18px 0 26px;border-top:4px solid #17110B;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.nm{font-family:"Archivo Black",sans-serif;font-size:34px;color:#17110B;line-height:1}
.dt{font-size:18px;color:#17110B;text-align:right;line-height:1.65}

/* F1 · Pretendard Black — 현대 고딕, 속공간 넓음 */
.f1 h1{font-family:Pretendard,sans-serif;font-weight:900;font-size:70px;letter-spacing:-.045em}
/* F2 · Noto Sans KR 900 — 가장 무난, 획 대비 안정 */
.f2 h1{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:68px;letter-spacing:-.04em}
/* F3 · 나눔명조 ExtraBold — 명조. 거친 2도 인쇄와 의외로 붙는다 */
.f3 h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:74px;letter-spacing:-.03em}
</style></head><body>

<div class="p f1" id="f1">
  <img class="bg" src="base.png">
  <div class="band">
    <h1>칸예 · 스캇 앨범<br><em>만든 DJ가 온다</em></h1>
    <div class="row"><div class="nm">EVIAN CHRIST</div>
      <div class="dt m">10.23 FRI · CAKESHOP ITAEWON<br>자정 전 25,000원 · 자정 후 30,000원</div></div>
  </div>
</div>

<div class="p f2" id="f2">
  <img class="bg" src="base.png">
  <div class="band">
    <h1>칸예 · 스캇 앨범<br><em>만든 DJ가 온다</em></h1>
    <div class="row"><div class="nm">EVIAN CHRIST</div>
      <div class="dt m">10.23 FRI · CAKESHOP ITAEWON<br>자정 전 25,000원 · 자정 후 30,000원</div></div>
  </div>
</div>

<div class="p f3" id="f3">
  <img class="bg" src="base.png">
  <div class="band">
    <h1>칸예 · 스캇 앨범<br><em>만든 DJ가 온다</em></h1>
    <div class="row"><div class="nm">EVIAN CHRIST</div>
      <div class="dt m">10.23 FRI · CAKESHOP ITAEWON<br>자정 전 25,000원 · 자정 후 30,000원</div></div>
  </div>
</div>

</body></html>
